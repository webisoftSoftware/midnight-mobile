name: Bug report
description: Report a reproducible defect using sanitized, synthetic data.
title: "bug: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include wallet seeds, checkpoints,
        credentials, private endpoint URLs, transaction payloads, or sensitive logs.
        Report security vulnerabilities through the private process in SECURITY.md.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - React Native API
        - Wallet runtime
        - Standard transport
        - Checkpoint handling
        - iOS packaging or build
        - Android packaging or build
        - Documentation
        - Tooling or CI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK version or commit
      description: Use a published version or full commit hash.
      placeholder: 0.1.0-alpha.1 or 0123456789abcdef...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description:
        Include Expo, React Native, OS, and device or simulator versions.
      placeholder: Expo 55, React Native 0.83, iOS simulator 18.x
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide deterministic steps and synthetic inputs only.
      placeholder: |
        1. Create...
        2. Call...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description:
        Include sanitized error text if it is needed to understand the defect.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional sanitized context
      description:
        Remove filesystem paths, identifiers, endpoints, and wallet material.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label:
            I used only synthetic data and removed secrets and privacy-sensitive
            material.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
