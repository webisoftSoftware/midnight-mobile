name: Security-safe feature request
description:
  Propose an in-scope wallet-core, packaging, or documentation change.
title: "feature: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need without sharing wallet material, credentials,
        private service details, or proprietary source. Social, FT/NFT, private
        gateway, and private fast-sync capabilities are outside the alpha scope.
        Use the private process in SECURITY.md for vulnerabilities.

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Add support for...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the concrete integration or developer problem.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Proposed area
      options:
        - Wallet-core API
        - React Native or Expo integration
        - Standard transport
        - Checkpoint host interface
        - iOS packaging
        - Android packaging
        - Documentation
        - Quality or release tooling
        - Deferred or demand-led work
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description:
        Describe behavior and acceptance criteria, not private implementation.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description:
        Identify new data, trust boundaries, endpoints, storage, or permissions.
      placeholder: No new sensitive data; the change...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: safety
    attributes:
      label: Safety and scope checks
      options:
        - label: I searched existing issues and the long-term plan.
          required: true
        - label:
            I included no seeds, checkpoints, credentials, private logs, or
            proprietary source.
          required: true
        - label:
            The request fits the accepted scope or clearly identifies a deferred
            demand gate.
          required: true
        - label: Any example data is deterministic and synthetic.
          required: true
