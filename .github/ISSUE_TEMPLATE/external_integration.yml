name: External integration report
description:
  Share a sanitized result from integrating the SDK into an independent app.
title: "integration: "
labels:
  - "external-demand"
body:
  - type: markdown
    attributes:
      value: |
        Integration reports measure external demand and compatibility. Share only
        public project information and sanitized results. Never attach seeds,
        checkpoints, credentials, private endpoints, transaction payloads, or
        sensitive logs.

  - type: input
    id: project
    attributes:
      label: Application or team
      description: Public name or a non-sensitive description is sufficient.
    validations:
      required: true

  - type: input
    id: sdk
    attributes:
      label: SDK version or commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Expo and React Native versions
      placeholder: Expo 55, React Native 0.83
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms tested
      multiple: true
      options:
        - iOS device
        - iOS simulator
        - Android device
        - Android emulator
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Preview
        - Preprod
        - Mainnet
        - Fully mocked services
        - Other synthetic environment
    validations:
      required: true

  - type: textarea
    id: endpoint_model
    attributes:
      label: Endpoint model
      description:
        Describe caller-supplied indexer, proof, and node roles without URLs or
        headers.
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: Features exercised
      description:
        List the wallet-core flows that were attempted and which succeeded.
    validations:
      required: true

  - type: input
    id: setup_time
    attributes:
      label: Setup time
      placeholder: 45 minutes to first successful native build
    validations:
      required: true

  - type: textarea
    id: build_results
    attributes:
      label: Native build results
      description:
        Report clean-install, archive, and release-build outcomes by platform.
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: Blockers and API gaps
      description:
        Include reproducible, sanitized failure categories and operational
        needs.

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label:
            This report contains no wallet material, credentials, private
            endpoints, transaction payloads, or sensitive logs.
          required: true
