name: Full local-equivalent quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-quality-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  quality:
    name: Full repository qualification
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Check out repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install and verify pinned native toolchains
        uses: ./.github/actions/setup-native

      - name: Run complete local-equivalent gate
        run: npm run quality

      - name: Upload full qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-quality-evidence
          path: |
            artifacts/native
            artifacts/release
          if-no-files-found: error
          retention-days: 14
