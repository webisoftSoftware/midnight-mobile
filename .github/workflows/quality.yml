name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install exact Node dependencies
        run: |
          corepack enable
          corepack prepare npm@11.12.1 --activate
          npm ci

      - name: Install pinned Rust quality tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.97.1
          cargo install cargo-llvm-cov --version 0.8.6 --locked
          cargo fetch --locked

      - name: Run lightweight pull-request gate
        run: npm run quality:pr
