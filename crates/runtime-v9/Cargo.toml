[package]
name = "midnight-mobile-runtime-v9"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "midnight_mobile_runtime_v9"
path = "../runtime/src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["ledger-v9"]
ledger-v9 = []

[dependencies]
anyhow = "=1.0.103"
bech32 = "=0.11.1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
hex = "=0.4.3"
num-bigint = { version = "=0.4.8", default-features = false }
rand = "=0.8.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
uniffi = { version = "=0.32.0" }
zeroize = { version = "=1.9.0", default-features = false }

# Same dependency keys as `runtime`, resolved to Ledger 9 so the shared sources
# compile unchanged. No zkir/proofs/rayon: the local prover stays on Ledger 8.
midnight-ledger = { package = "midnight-ledger-v9", git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger.git", tag = "ledger-9.1.0.0-rc.5", default-features = false }

[dev-dependencies]
rayon = "=1.12.0"
