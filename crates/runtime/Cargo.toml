[package]
name = "midnight-native-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
local-prover = [
  "dep:futures-executor",
  "dep:midnight-proofs",
  "dep:midnight-zkir",
  "dep:rayon",
]

[lib]
name = "midnight_native_runtime"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.103"
bech32 = "=0.11.1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
hex = "=0.4.3"
num-bigint = { version = "=0.4.8", default-features = false }
rand = "=0.8.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
uniffi = { version = "=0.32.0" }
zeroize = { version = "=1.9.0", default-features = false }

# All Midnight crates resolve from the Ledger 8.1.0 release commit. Keeping the
# main ledger dependency here (rather than reconstructing FEE_TOKEN locally)
# keeps the production runtime linked to the canonical Ledger definition.
midnight-ledger = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false }
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "02716c2c95d50654aeb3cb63bfd8386046e4ca7d", default-features = false, optional = true }
futures-executor = { version = "=0.3.32", optional = true }
midnight-proofs = { version = "=0.7.2", optional = true }
rayon = { version = "=1.12.0", optional = true }

[dev-dependencies]
proptest = "=1.11.0"
